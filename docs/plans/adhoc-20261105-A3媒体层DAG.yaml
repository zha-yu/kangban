# A3 · Day 3 WebRTC 媒体层 DAG 执行路径
# 本文件是 docs/plans/adhoc-20261105-A3媒体层执行计划.md 的独立机器可读执行图。
# 仅描述计划、依赖与验收，不包含业务代码；所有节点初始为 pending。

schema_version: "1.0"
plan_id: "day03-a3-webrtc-media"
plan_document: "docs/plans/adhoc-20261105-A3媒体层执行计划.md"
dag_document: "docs/plans/adhoc-20261105-A3媒体层DAG.yaml"
date: "2026-11-05"
timezone: "Asia/Shanghai"
owner: "A3"
status: "planned"
execution_mode: "timeboxed"
objective: "完成 aiortc PeerConnection、上下行音频轨、16k PCM 分帧、TTS 写轨、打断与资源回收，并可被 A2/A4/A5 联调验收。"

resource_scope:
  write_allow:
    - "app/audio/webrtc.py"
  conditional_write:
    - path: "tests/test_audio_webrtc.py"
      condition: "仅在 D1 明确授权 A3 与 A5 协作时；默认归 A5"
  read_only:
    - "app/core/config.py"
    - "app/audio/asr.py"
    - "app/audio/signaling.py"
    - "app/audio/vad.py"
    - "spikes/reference/asr/**"
  forbidden:
    - "frontend/**"
    - "app/main.py"
    - "app/api/**"
    - "app/core/**"
    - "app/services/**"
    - "app/models/**"
    - "alembic/**"
    - "docker-compose.yml"
    - "pyproject.toml"
    - "*.env"
    - "docs/康伴3D数字人_PRD.md"
    - "docs/康伴3D数字人_技术设计文档.md"

contracts:
  C1:
    owner: "A1"
    required_by: "09:30"
    consumed_by_a3:
      - "ASRProvider.stream(audio) -> AsyncIterator[ASREvent]"
      - "ASREvent.kind: partial|final|error"
      - "ASRResult.text"
      - "ASRResult.is_final"
      - "ASRResult.confidence: float|None"
    constraint: "A3 不复制协议定义；FunASR 无置信度时保持 null，不伪造 0.0。"
  C2:
    owner: "A2"
    required_by: "09:30"
    consumed_by_a3:
      - "offer { sdp }"
      - "answer { sdp }"
      - "ice { candidate }"
      - "asr_start / asr_end"
      - "连接关闭语义"
    constraint: "A3 不解析 WS、不鉴权、不发送 WS 帧；connection_id 由 A2 分配。"
  A4_offer:
    owner: "A4"
    required_by: "14:30"
    constraint: "必须存在一个 sendrecv 音频 m-line，并开启 echoCancellation/noiseSuppression/autoGainControl。"
  A1_pcm:
    owner: "A1"
    required_by: "13:10"
    constraint: "TTS 输出为 16 kHz/16 bit/mono 原始 PCM，不含 WAV 容器头。"
  A5_tests:
    owner: "A5"
    required_by: "09:30"
    constraint: "默认 tests/ 归 A5；A3 仅提供测试向量与联调证据。"

decisions:
  - id: "D1"
    question: "tests/test_audio_webrtc.py 归 A3 还是 A5"
    default: "A5 所有；A3 只提供向量，不写测试文件"
    deadline: "09:20"
    blocks: ["T6_TEST", "T6_HANDOFF"]
  - id: "D2"
    question: "WS 断开后是否立即关闭 PeerConnection"
    default: "按 A3 任务卡与 C2：A2 最终关闭连接时 A3 立即关闭 PC"
    deadline: "09:20"
    blocks: ["INT1", "INT3"]
  - id: "D3"
    question: "ASR 会话由 A2 还是 A3 启动/结束"
    default: "A3 在 begin_turn/end_turn 内管理；A2 仅转发控制消息"
    deadline: "09:20"
    blocks: ["INT2"]
  - id: "D4"
    question: "重复 offer 与早到 ICE 的幂等语义"
    default: "一连接一 PC；首 offer 生效；早到 ICE 缓存；重复 offer 拒绝"
    deadline: "09:20"
    blocks: ["M3_2", "M3_3"]
  - id: "D5"
    question: "preRoll 由 WS 补发还是 A3 本地缓存"
    default: "A3 本地 600 ms 环形缓冲，不要求 WS 补发 PCM"
    deadline: "09:20"
    blocks: ["M2_3"]
  - id: "D6"
    question: "WebRTC/ICE 失败在 C2 使用哪个错误码"
    default: "不新增 WS code；A3 发结构化失败，A4 依本地 5 秒计时降级"
    deadline: "09:20"
    blocks: ["INT3"]
  - id: "D7"
    question: "WEBRTC_ICE_SERVERS 不存在，如何读取 ICE 配置"
    default: "使用现有 stun_url/turn_* 字段；localhost 走 host candidate"
    deadline: "09:20"
    blocks: ["M1_2"]
  - id: "D8"
    question: "60 ms ASR 帧与 30 ms VAD 帧如何共存"
    default: "同一 20 ms 规范流分叉为 60/30 ms 两个缓冲"
    deadline: "09:20"
    blocks: ["M2_4"]

gates:
  - id: "G0"
    name: "契约冻结门"
    at: "09:30"
    pass:
      - "C1/C2 类型与语义可落地"
      - "A4 确认 sendrecv 音频 offer"
      - "A1 确认 16 kHz raw PCM"
      - "A5 确认测试所有权或书面授权"
    fail_action: "不写猜测接口；升级主理人"
  - id: "G1"
    name: "媒体骨架门"
    at: "10:30"
    pass:
      - "模块可 import"
      - "loop 防护可复现"
      - "重复关闭不抛未捕获异常"
      - "git diff 仅目标文件"
    fail_action: "上午补齐，不进入收轨"
  - id: "G2"
    name: "收轨分帧门"
    at: "11:30"
    pass:
      - "60 ms 帧 1920 B / 960 samples"
      - "30 ms 帧 960 B / 480 samples"
      - "60 秒输入 1000 个 60 ms 帧"
      - "preRoll 600 ms 完整"
      - "尾帧零填充不丢"
    fail_action: "12:00 前修复或 12:10 升级"
  - id: "H1"
    name: "收轨与回声检查点"
    at: "12:00"
    pass:
      - "offer→answer→ICE→connected 成功"
      - "服务侧连续 60 ms 帧"
      - "本机耳机可闻自回声"
      - "日志带 trace_id"
    fail_action: "不冒充完成；说明缺 C1/C2/A4 哪项"
  - id: "H2"
    name: "写轨与打断检查点"
    at: "14:30"
    pass:
      - "TTS 16→48 kHz 写轨可闻"
      - "1 秒音频 50 帧，时长误差 ≤20 ms"
      - "barge_in 后队列归零"
      - "旧 turn 100% 拒绝"
    fail_action: "仅回声联调，V4 记未完成"
  - id: "H3"
    name: "三方联调冻结"
    at: "16:30"
    pass:
      - "localhost 10/10 建连"
      - "ICE 失败 5–6 秒回收"
      - "active_sessions=0, pending_tasks=0"
      - "交接包齐全"
    fail_action: "保持任务进行中，登记偏差"

