[project]
name = "celery-reminder"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "幽梦", email = "tianqihou@qq.com" }
]
requires-python = ">=3.13"
dependencies = [
    "celery-redbeat>=2.2",
    "celery[redis]>=5.3",
    "flower>=2.2.0",
    "nbformat>=5.11.1",
    "redis>=5.0",
]

[project.scripts]
celery-reminder = "celery_reminder:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
