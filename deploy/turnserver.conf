# ============================================================================
# coturn 服务器配置（Day 10 · A2-b，dev-A）
# 对齐既有链路：day09 D2.5 的 GET /api/audio/ice-config 从 config.py 读
# turn_url / turn_username / turn_credential 下发给 pad（字段只读不改名），
# 本服务的鉴权值必须与 .env 的 TURN_USERNAME / TURN_CREDENTIAL 同源——
# 用户名与口令经 compose command 以变量注入（见 docker-compose.yml），
# **不在此文件写死凭据**（本文件进 git）。
#
# ⚠ coturn 配置解析器不支持行内注释：注释必须独占一行（实测踩坑留痕，
#   S4 首版行内注释被当成参数值导致启动循环重启）。
# ============================================================================

listening-port=3478
# tls-listening-port=5349        # 未启用：S7 裁决业务只用 3478（见下方 no-tls）
# cert=/etc/coturn/certs/server.pem   # 若将来启用 turns:，复用 deploy/certs/ 里 S7 生成的 CA 签发证书
# pkey=/etc/coturn/certs/server.key

fingerprint
# long-term credentials：与 ice-config 下发的固定用户名/口令匹配
lt-cred-mech
realm=silvermate.local

# 中继端口收窄（教学场景）：容器内默认 49152-65535 太宽，收窄后便于按需映射宿主端口
min-port=49160
max-port=49200

# 跨 NAT / 跨网段中继（S7）：本文件进 git，不写死任何机器 IP；宿主可达地址经
# `.env` 的 TURN_EXTERNAL_IP_ARG（整段 `--external-ip=<宿主IP>`）由 compose command
# 注入，等价于下面这行。单机开发该变量留空即可（不传参数，relay 地址落 Docker 内网）。
# external-ip=<宿主局域网IP或公网IP>

no-multicast-peers

# S7 裁决：5349 TLS / DTLS **不启用**（ice-config 下发的 turn_url 是 turn:...:3478，
# 无 turns: 消费方）。coturn 默认会尝试起 TLS 监听器并因找不到证书刷 WARNING，
# 本版本识别的开关是 `no-tls`（DTLS 默认就不启，无需 --dtls）。
# 旧两行清理：`no-cli` 已 deprecated（CLI 默认 OFF）、`no-tlsv1` 本版本报
# "Bad configuration format"（正确写法是 tlsv1 / no-tlsv1_2，但我们不需要）。
no-tls

# 日志走 stdout（docker logs 可查）
log-file=stdout
simple-log
