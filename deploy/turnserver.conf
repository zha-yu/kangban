# ============================================================================
# coturn 服务器配置（Day 10 · A2-b，dev-A）
# 对齐既有链路：day09 D2.5 的 GET /api/audio/ice-config 从 config.py 读
# turn_url / turn_username / turn_credential 下发给 pad（字段只读不改名），
# 本服务的鉴权值必须与 .env 的 TURN_USERNAME / TURN_CREDENTIAL 同源——
# 用户名与口令经 compose command 以变量注入（见 docker-compose.yml），
# **不在此文件写死凭据**（本文件进 git）。
#
# ⚠ coturn 配置解析器不支持行内注释：注释必须独占一行（实测踩坑留痕，
#   S4 首版行内注释被当成参数值导致启动循环重启）。
# ============================================================================

listening-port=3478
# tls-listening-port=5349        # S7 证书就绪后放开
# cert=/etc/letsencrypt/live/<host>/fullchain.pem
# pkey=/etc/letsencrypt/live/<host>/privkey.pem

fingerprint
# long-term credentials：与 ice-config 下发的固定用户名/口令匹配
lt-cred-mech
realm=silvermate.local

# 中继端口收窄（教学场景）：容器内默认 49152-65535 太宽，收窄后便于按需映射宿主端口
min-port=49160
max-port=49200

# 跨 NAT 部署（公网/跨网段中继）时必须放开并填宿主可达地址；局域网教学场景留注释：
# external-ip=<宿主局域网IP或公网IP>

no-multicast-peers
no-cli
no-tlsv1

# 日志走 stdout（docker logs 可查）
log-file=stdout
simple-log
