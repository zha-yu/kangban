# ============================================================================
# 康伴（SilverMate）· 3D 数字人静态资产 location 片段（Day 4 · A3 · T5）
#
# 1. 本文件的主体是下面 `location /avatars/` 这一段：真实部署时应**原样放进** nginx
#    配置的 `server { ... }` 里（技术设计文档 §2.1：nginx 托管前端产物与静态资产）。
# 2. `.vrm` 的 MIME 必须是 `model/gltf-binary`：three-vrm / GLTFLoader 不靠 Content-Type
#    判断格式，但联调步骤「curl -sI … | grep -i content-type」就是断言这一行；写成
#    octet-stream 时文件照样能下载、验收却不过。
# 3. 静态资源**不经后端转发**：location 用 alias 直接落到磁盘目录，没有 proxy_pass；
#    后端只负责在 `/api/pad/avatar-config` 里回一个 URL 字符串（T2/T3）。
# 4. `Access-Control-Allow-Origin` 回显 `$http_origin`：联调期前端在 https://localhost、
#    资产在 http://127.0.0.1:8080（计划 §5 R1），跨源必须带这个头；不用 `*` 是给将来
#    带凭据的请求留余地。
# 5. `Cache-Control: max-age=300` 只做短缓存兜底：形象换文件后前端靠 avatar-config
#    响应里的 `version` 指纹失效缓存，这里刻意不设 immutable。
#
# ⚠ 为了让计划 §4 的一次性容器验证能直接把本文件
#   `-v deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro` 挂进 nginx:alpine，
#   下面额外包了一层**最小 server{}**（只 listen 80，没有 root / try_files / 其他 location）。
#   集成本仓 compose 时**只抄 location 段**，别把 server 段一起抄——那会和现有 frontend
#   server 抢 80 端口（A-01 已裁决 nginx 不进 compose，本文件只供一次性验证）。
# ============================================================================

server {
    listen 80;
    server_name _;

    location /avatars/ {
        alias /usr/share/nginx/html/assets/avatars/;
        types { model/gltf-binary vrm; }
        default_type application/octet-stream;
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Cache-Control "public, max-age=300";
    }
}
