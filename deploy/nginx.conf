# ============================================================================
# 康伴（SilverMate）· nginx 完整托管配置（Day 10 · A3-a / S6，dev-A 独占）
#
# 本文件被 docker-compose.yml 的 nginx 服务以只读卷挂到
#   /etc/nginx/conf.d/default.conf
# 覆盖 frontend/frontend.Dockerfile（dev-C C1）镜像内自带的 Y1 草案。
#
# ── 与 Y1 草案（C1 镜像内 default.conf）的 diff，逐条留痕 ───────────────────
# 1. 【S3 移交缺陷修复】草案用 `set $backend_upstream http://backend:8000;`
#    + `proxy_pass $backend_upstream;`（变量化）但**没有 resolver**，nginx 在
#    请求期无法解析 "backend"，/api 实测 502（error.log: "no resolver defined
#    to resolve backend"）。本文件补 `resolver 127.0.0.11`（Docker 内嵌 DNS）。
#    刻意**不改成静态 upstream 块**：静态 upstream 只在 nginx 启动时解析一次，
#    backend 容器重建换 IP 后会一直指向旧 IP；变量 + resolver 才有运行时重解析。
# 2. 【S6 新增】80 → 443 全站 301、TLS 终止（证书 /etc/nginx/certs/，不进 git）。
# 3. 【S6 新增】`location = /health` 反代 backend /health —— 任务书 A2/M6.1
#    判据是 `curl https://localhost/health` 返回 status:ok 带 trace_id，而
#    backend 的 health 路由**没有 /api 前缀**（app/api/__init__.py ROUTERS）。
# 4. 【S6 新增】`location /static/` 反代 backend 的 StaticFiles mount
#    （app/main.py L1130-1137：TTS WAV `/static/mock/*.wav`、戏曲媒体
#    `/static/media/opera/*`）。镜像内草案无此段，nginx 上线后这些 URL 会 404。
# 5. 【S6 新增】`/assets/vrm/*.vrm` 以 model/gltf-binary 下发（正则 location +
#    default_type）；`/avatars/` 段保留 Day4 口径并把 `types{}` 改为
#    `default_type model/gltf-binary`——原写法只定义了 vrm，导致同目录 .png
#    头像被当作 octet-stream；同时 `^~` 保护 alias 不被 .vrm 正则抢走。
# 6. 【S6 调整】Connection 头由固定的 "upgrade" 改为 map $connection_upgrade
#    （无 Upgrade 请求 → close），普通 GET 不再被强加 upgrade 头；
#    proxy_* 公共头集中到 server 级，各 location 只写 proxy_pass。
# 7. 【S6 调整】healthcheck 探 80 的 `/nginx-health`（纯 nginx 存活，返回 200），
#    不再探 `http://127.0.0.1/pad/`——80 已改为 301 跳 443，且 busybox wget
#    的 HTTPS/跟随重定向能力在 alpine 各版本不一致，不适合做探活。
#
# ── 证书（S6 验证前置，S7 收口为 mkcert 受控信任）──────────────────────────
# 本文件挂载生效前，宿主必须存在 deploy/certs/server.pem + server.key。
# 生成命令（Git Bash / Linux / macOS；S6 用的是自签，S7 换 mkcert 同名覆盖）：
#   mkdir -p deploy/certs
#   MSYS_NO_PATHCONV=1 openssl req -x509 -newkey rsa:2048 -sha256 -nodes \
#     -days 365 -keyout deploy/certs/server.key -out deploy/certs/server.pem \
#     -subj "/CN=localhost" \
#     -addext "subjectAltName=DNS:localhost,DNS:host.docker.internal,IP:127.0.0.1"
# 证书与私钥 **不进 git**（根 .gitignore 已有 `certs/` / `*.pem` / `*.key`）；
# 干净主机演练需先生成或经 S7 的受控证书步骤落地，登记为 S7 待办。
#
# ── 其余保留自 Y1 草案 ───────────────────────────────────────────────────
# 三入口 MPA（/pad /console /family，产物路径 Y3：
# /usr/share/nginx/html/{pad,console,family}）＋ public 运行时数据
# /assets/ /kws/ /vad-assets/ /media/ ＋ 根路径 302 跳长者端。
# ============================================================================

# WebSocket Upgrade 头：无 Upgrade 请求回 close，避免对所有 /api 请求强加 upgrade
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ----------------------------------------------------------------------------
# 80：只做跳转 + 自身存活探活（compose healthcheck 用）
# ----------------------------------------------------------------------------
server {
    listen 80;
    server_name _;
    absolute_redirect off;

    # 纯 nginx 存活探针：不依赖 backend、不依赖 HTTPS，alpine busybox wget 可探
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 全站跳 HTTPS（getUserMedia 硬要求，PRD §2.5）。
    # 用 $host 而非 $http_host：不带宿主端口，映射到 443；若自定义了
    # NGINX_HTTPS_HOST_PORT 非 443，需在此显式补端口（登记为已知口径）。
    location / {
        return 301 https://$host$request_uri;
    }
}

# ----------------------------------------------------------------------------
# 443：三入口静态托管 + 后端反代
# ----------------------------------------------------------------------------
server {
    listen 443 ssl;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;          # 相对 Location，避免跳到 http://host:port

    # ---- TLS（S6 自签验证 / S7 mkcert 受控信任，同名文件覆盖即可）----
    ssl_certificate     /etc/nginx/certs/server.pem;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 25m;       # 按住说话整段上传降级 / 音频回执

    # ---- 反代公共配置（server 级继承，location 内不再重复 proxy_set_header）----
    # 变量化上游 + Docker DNS：修 S3 的 no resolver 缺陷，且 backend 重建换 IP
    # 后 10s 内自动重解析；nginx 启动时 backend 缺席也不会直接启动失败。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8000;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_connect_timeout              5s;

    # ---- 根路径 → 长者端（保留 Y1 草案）----
    location = / { return 302 /pad; }

    # ---- 三入口 MPA（Y3 产物路径，Y1 静态段原样保留）----
    location /pad     { try_files $uri $uri/ /pad/index.html; }
    location /console { try_files $uri $uri/ /console/index.html; }
    location /family  { try_files $uri $uri/ /family/index.html; }

    # ---- public 运行时数据（三入口共用根路径，pad 实际引用）----
    location /assets/     { try_files $uri =404; }
    location /kws/        { try_files $uri =404; }
    location /vad-assets/ { try_files $uri =404; }
    location /media/      { try_files $uri =404; }

    # VRM：three-vrm 不靠 Content-Type 判断格式，但 Day4 联调断言这一行；
    # 正则 location 优先于 /assets/ 前缀，default_type 覆盖 mime.types 未登记的扩展名。
    location ~* \.vrm$ {
        root /usr/share/nginx/html;
        default_type model/gltf-binary;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=300";
    }

    # ---- Day4 /avatars/ 段（保留：alias 直出、CORS 回显、短缓存）----
    # ^~ 防止上面的 .vrm 正则抢走 /avatars/*.vrm；default_type 让 .vrm 回
    # model/gltf-binary，同时 .png 仍按 mime.types 回 image/png。
    location ^~ /avatars/ {
        alias /usr/share/nginx/html/assets/avatars/;
        default_type model/gltf-binary;
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Cache-Control "public, max-age=300";
    }

    # ---- 健康检查（无 /api 前缀，M6.1 判据 https://localhost/health）----
    location = /health {
        proxy_pass $backend_upstream;
    }

    # ---- backend StaticFiles（TTS WAV / 戏曲媒体，S6 补）----
    location /static/ {
        proxy_pass $backend_upstream;
        proxy_read_timeout 60s;
    }

    # ---- REST API（/api/*，含 ice-config / metrics / 健康记录等）----
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_read_timeout 120s;
    }

    # ---- 信令 WebSocket（/ws/signal，契约裁决 A-03 无 /api 前缀）----
    location /ws {
        proxy_pass $backend_upstream;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
