<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>康伴 · 浏览器端 VAD 示例</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6f3;color:#193e34;font:15px/1.7 "Microsoft YaHei",sans-serif}main{max-width:960px;margin:40px auto;padding:0 24px}a{color:#286955}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:30px;margin-bottom:8px}p{color:#6b8075}.card{background:white;border:1px solid #d9e5dc;border-radius:18px;padding:26px;margin-top:22px}h2{font-size:18px;margin-top:0}.badge{background:#e9f1e8;border-radius:20px;padding:5px 12px;font-size:12px}.fields{display:flex;gap:24px;flex-wrap:wrap}label{font-size:13px;display:block}input{display:block;margin-top:8px;padding:9px;border-radius:8px;border:1px solid #ccdacf;width:130px}button{cursor:pointer;background:#28634f;color:white;border:0;border-radius:9px;padding:12px 18px;font:inherit;margin:14px 8px 0 0}button.secondary{background:#edf3ea;color:#38664c}button:disabled{opacity:.4;cursor:not-allowed}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #8dbda5;outline-offset:3px}.status{display:flex;gap:14px;align-items:center;padding:20px 0}.dot{width:14px;height:14px;background:#b3c5b9;border-radius:50%}.speaking .dot{background:#3a9568;box-shadow:0 0 0 8px #e7f4e8}.status strong{font-size:21px}#error{color:#9c492c;white-space:pre-wrap}pre{background:#f4f7f1;padding:16px;max-height:220px;overflow:auto;white-space:pre-wrap;font-size:12px}article{border-top:1px solid #e1e9df;padding:14px 0;display:flex;gap:18px;align-items:center;flex-wrap:wrap}audio{max-width:100%;height:36px}.note{font-size:12px;color:#718576}meter{width:100%;height:16px}#segments:empty:after{content:'检测到的语音片段会出现在这里，可在本机回放或下载。';color:#91a194}footer{padding:24px 0;color:#718576;font-size:12px}@media(max-width:600px){h1{font-size:24px}.card{padding:20px}main{margin-top:24px}header{gap:20px}}
</style></head><body><main><header><a href="/">← 返回语音空间</a><span class="badge">纯端侧 · TEN-VAD / WASM</span></header><h1>在浏览器里，听见人声。</h1><p>本示例只检测人声起止，不做声纹验证和文字识别。音频留在浏览器，不调用 Docker。</p><section class="card"><h2>检测设置</h2><div class="fields"><label>人声阈值<input id="threshold" type="number" min="0.1" max="0.9" step="0.05" value="0.5"></label><label>结束静音（秒）<input id="silence" type="number" min="0.2" max="2" step="0.1" value="0.5"></label><label>最短语音（秒）<input id="minSpeech" type="number" min="0.1" max="1" step="0.05" value="0.25"></label></div><div class="status" id="indicator"><span class="dot"></span><strong id="status" aria-live="polite">正在加载本地模型…</strong></div><meter id="level" min="0" max="1" value="0" aria-label="麦克风音量"></meter><div><button id="start" disabled>开始麦克风检测</button><button id="stop" disabled class="secondary">停止</button><button id="sample" disabled class="secondary">用示例音频验证</button></div><p class="note" id="detail">首次需加载约 12 MB WASM 和模型资源，加载完成后无需联网推理。</p><div id="error" role="alert"></div></section><section class="card"><h2>语音片段 <span id="count" class="badge">0 段</span></h2><div id="segments"></div><button id="clear" class="secondary">清空片段与事件</button><h2 style="margin-top:26px">检测事件</h2><pre id="events" aria-live="polite">等待开始。</pre><p class="note">人声开始事件有最短语音确认延迟；片段起止以模型返回的采样位置为准。连续说话超过 20 秒时会分段。</p></section><footer>AudioWorklet 采音与重采样 → 16 kHz 单声道 → TEN-VAD 每帧 256 点 → 开始 / 结束事件与 WAV 片段</footer></main><script src="/vad-assets/sherpa-onnx-vad.js"></script><script src="ten-vad.js"></script><script src="demo.js"></script><script src="/vad-assets/sherpa-onnx-wasm-main-vad.js"></script></body></html>
