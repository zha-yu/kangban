services:
  funasr:
    image: registry.cn-hangzhou.aliyuncs.com/funasr_repo/funasr:funasr-runtime-sdk-online-cpu-0.1.13
    container_name: funasr
    privileged: true
    init: true
    restart: unless-stopped
    ports:
      - "${FUNASR_PORT:-10096}:10095"
    volumes:
      - ./funasr-runtime-resources/models:/workspace/models
    working_dir: /workspace/FunASR/runtime/websocket/build/bin
    # run_server_2pass.sh backgrounds this executable. Run it directly in the
    # foreground so Docker can track failures, stop it, and restart it correctly.
    entrypoint: ["/workspace/FunASR/runtime/websocket/build/bin/funasr-wss-server-2pass"]
    command:
      - --download-model-dir
      - /workspace/models
      - --vad-dir
      - damo/speech_fsmn_vad_zh-cn-16k-common-onnx
      - --model-dir
      - damo/speech_paraformer-large-vad-punc_asr_nat-zh-cn-16k-common-vocab8404-onnx
      - --online-model-dir
      - damo/speech_paraformer-large_asr_nat-zh-cn-16k-common-vocab8404-online-onnx
      - --punc-dir
      - damo/punc_ct-transformer_zh-cn-common-vad_realtime-vocab272727-onnx
      - --lm-dir
      - damo/speech_ngram_lm_zh-cn-ai-wesp-fst
      - --itn-dir
      - thuduj12/fst_itn_zh
      - --hotword
      - /workspace/models/hotwords.txt
      - --port
      - "10095"
      - --decoder-thread-num
      - "${FUNASR_DECODER_THREADS:-4}"
      - --model-thread-num
      - "1"
      - --io-thread-num
      - "1"
      - --certfile
      - /workspace/FunASR/runtime/ssl_key/server.crt
      - --keyfile
      - /workspace/FunASR/runtime/ssl_key/server.key
    healthcheck:
      # The bundled certificate is self-signed. This probe checks local TLS
      # readiness only; application clients configure certificate trust separately.
      test:
        - CMD
        - python3
        - -c
        - >-
          import socket, ssl;
          c = ssl.SSLContext(ssl.PROTOCOL_TLS_CLIENT);
          c.check_hostname = False;
          c.verify_mode = ssl.CERT_NONE;
          s = socket.create_connection(('127.0.0.1', 10095), timeout=5);
          t = c.wrap_socket(s, server_hostname='localhost');
          t.close()
      start_period: 180s
      interval: 15s
      timeout: 8s
      retries: 5
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
