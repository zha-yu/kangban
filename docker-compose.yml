# 本地依赖服务最小版（task-3）：postgres + redis，Day 3 任务卡 a1 追加 funasr（本地 ASR 基线）。
# 完整 7 服务版（nginx / coturn / backend / laya）按大纲留到 Day 10；
# 两个 MCP server（mock-operations-mcp:7102 / weather-mcp:7101）为提前件，contracts.md 留痕。
# 口令默认值与 .env.example / app/core/config.py 的本地默认一致；生产值一律经 .env 覆盖，不写死在这里。
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: silvermate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-silvermate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-silvermate}
      POSTGRES_DB: ${POSTGRES_DB:-silvermate}
    ports:
      # 宿主端口可经环境变量改写（默认 5432，与 README §6 端口约定一致）；
      # 本机 5432 被其他项目占用时，在 .env 里设 POSTGRES_HOST_PORT 换端口。
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-silvermate} -d ${POSTGRES_DB:-silvermate}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: silvermate-redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  funasr:
    # 本地 ASR 基线（FunASR runtime，2pass 双通路流式）。宿主端口 7002 —— 7001 已登记给 laya
    # （见 docs/plans/task-a1-ASR与TTS适配层.md §4.4 与 §9-1），不要再抢。
    # 镜像内 FunASR runtime 默认监听 10095；本服务**不开 TLS**（官方 run_server_2pass.sh 里
    # --certfile/--keyfile 同样是注释掉的），所以客户端用 ws:// 而不是 wss://。
    image: registry.cn-hangzhou.aliyuncs.com/funasr_repo/funasr:funasr-runtime-sdk-online-cpu-0.1.12
    container_name: silvermate-funasr
    init: true
    restart: unless-stopped
    ports:
      # 宿主端口可经环境变量改写（默认 7002，与 README §6 端口约定一致）。
      - "${FUNASR_HOST_PORT:-7002}:10095"
    volumes:
      # 首次启动按 --download-model-dir 下载到具名卷，之后复用；模型不进镜像层、也不落仓库目录。
      - funasr_models:/workspace/models
    working_dir: /workspace/FunASR/runtime/websocket/build/bin
    # 镜像内 run_server_2pass.sh 会把识别程序丢到后台并退出；这里直接前台起同一个可执行文件，
    # 让 Docker 能跟踪退出状态、restart 与日志（与参考 compose 同一做法）。
    entrypoint: ["/workspace/FunASR/runtime/websocket/build/bin/funasr-wss-server-2pass"]
    command:
      - --download-model-dir
      - /workspace/models
      - --vad-dir
      - damo/speech_fsmn_vad_zh-cn-16k-common-onnx
      - --model-dir
      - damo/speech_paraformer-large-vad-punc_asr_nat-zh-cn-16k-common-vocab8404-onnx
      - --online-model-dir
      - damo/speech_paraformer-large_asr_nat-zh-cn-16k-common-vocab8404-online-onnx
      - --punc-dir
      - damo/punc_ct-transformer_zh-cn-common-vad_realtime-vocab272727-onnx
      - --lm-dir
      - damo/speech_ngram_lm_zh-cn-ai-wesp-fst
      - --itn-dir
      - thuduj12/fst_itn_zh
      - --port
      - "10095"
      - --decoder-thread-num
      - "4"
      - --model-thread-num
      - "1"
      - --io-thread-num
      - "1"
    healthcheck:
      # 纯 TCP 探活：本服务不开 TLS，所以不做 TLS 握手（参考 compose 那版是为了 wss 才握手的）。
      # 首次要下载 + 加载模型（几 GB、几分钟），start_period 给足 180s；之后每 10s 一次，
      # 连续 6 次失败才标 unhealthy。健康检查失败不会自动重启容器，慢机器上「先 unhealthy 后
      # healthy」属正常，重看 docker compose ps 即可。
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1', 10095), timeout=5).close()"]
      start_period: 180s
      interval: 10s
      timeout: 5s
      retries: 6
    # 限核：ASR 推理是 CPU 密集，别让它把 postgres/redis 和本地开发抢死（deploy 段在非 swarm
    # 的 docker compose v2 下同样生效）。
    deploy:
      resources:
        limits:
          cpus: "2"
    stop_grace_period: 30s

  mock-operations-mcp:
    # mock-operations MCP 容器（Day 10 七服务版提前件，contracts.md v1.8 口径）：
    # create_work_order / send_family_notification 两工具，Mock 落库非真实外发。
    # 容器内绑 0.0.0.0 供 backend 走 compose 内部网络（mock-operations-mcp:7102）。
    # 环回端口映射：让宿主机（本地裸跑的 backend / curl）也能访问容器，
    # 仅绑 127.0.0.1 不暴露公网；backend 容器化后改走内部服务名，届时可移除。
    ports:
      - "127.0.0.1:7102:7102"
    build:
      context: .
      dockerfile: deploy/mock-operations/Dockerfile
    container_name: silvermate-mock-operations-mcp
    restart: unless-stopped
    environment:
      MOCK_OPERATIONS_MCP_HOST: 0.0.0.0
      # 容器内覆盖 .env 的本地库地址：一律指向 compose 服务名 postgres
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-silvermate}:${POSTGRES_PASSWORD:-silvermate}@postgres:5432/${POSTGRES_DB:-silvermate}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # MCP 协议级探活：POST tools/list，能返回 JSON-RPC 即存活
      test: ["CMD", "python", "-c", "import urllib.request,json; req=urllib.request.Request('http://127.0.0.1:7102/mcp', data=json.dumps({'jsonrpc':'2.0','id':1,'method':'tools/list','params':{}}).encode(), headers={'Content-Type':'application/json','Accept':'application/json'}); urllib.request.urlopen(req, timeout=5).read()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  weather-mcp:
    # weather MCP 容器（Day 10 七服务版提前件）：唯一真实外部接口 MCP（AGENTS §1）。
    # 容器内绑 0.0.0.0 供 backend 走 compose 内部网络（weather-mcp:7101）；
    # **不做宿主机端口映射**（本地裸跑用 `uv run python mcp-servers/weather/server.py --http`）。
    # 密钥经 compose 变量替换从 .env 注入环境变量，不进镜像层；缺 key 时
    # weather_core 按口径返回「key 未配置」的显式失败，不编造天气。
    build:
      context: .
      dockerfile: deploy/weather/Dockerfile
    container_name: silvermate-weather-mcp
    restart: unless-stopped
    environment:
      WEATHER_MCP_HOST: 0.0.0.0
      WEATHER_API_PROVIDER: ${WEATHER_API_PROVIDER:-amap}
      WEATHER_API_BASE_URL: ${WEATHER_API_BASE_URL:-}
      WEATHER_API_KEY: ${WEATHER_API_KEY:-}
      WEATHER_CACHE_TTL_SECONDS: ${WEATHER_CACHE_TTL_SECONDS:-600}
    # 环回端口映射（同 mock-operations-mcp 口径）：仅绑 127.0.0.1，宿主机可访问
    ports:
      - "127.0.0.1:7101:7101"
    healthcheck:
      # MCP 协议级探活：POST tools/list，能返回 JSON-RPC 即存活
      test: ["CMD", "python", "-c", "import urllib.request,json; req=urllib.request.Request('http://127.0.0.1:7101/mcp', data=json.dumps({'jsonrpc':'2.0','id':1,'method':'tools/list','params':{}}).encode(), headers={'Content-Type':'application/json','Accept':'application/json'}); urllib.request.urlopen(req, timeout=5).read()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  voiceprint:
    # 声纹推理容器（Day 4 A1）。只做 POST /extract + GET /health。
    # 比对在主服务进程内 numpy 完成，容器不装 torch（重依赖隔离）。
    # 宿主端口 7003（compose 网络内主服务用 voiceprint:7003）。
    build:
      context: ./deploy/voiceprint
      dockerfile: Dockerfile
    container_name: silvermate-voiceprint
    restart: unless-stopped
    ports:
      - "${VOICEPRINT_HOST_PORT:-7003}:7003"
    volumes:
      # 模型文件（CAM++ .onnx）手动放 deploy/voiceprint/models/ 后 compose 自动挂载
      - ./deploy/voiceprint/models:/app/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7003/health', timeout=5).read()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1"

volumes:
  postgres_data:
  funasr_models:
