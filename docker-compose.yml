# 本地依赖服务最小版（task-3）：postgres + redis，Day 3 任务卡 a1 追加 funasr（本地 ASR 基线）。
# 完整 7 服务版（nginx / coturn / backend / laya）按大纲留到 Day 10；
# 两个 MCP server（mock-operations-mcp:7102 / weather-mcp:7101）为提前件，contracts.md 留痕。
# 口令默认值与 .env.example / app/core/config.py 的本地默认一致；生产值一律经 .env 覆盖，不写死在这里。
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: silvermate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-silvermate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-silvermate}
      POSTGRES_DB: ${POSTGRES_DB:-silvermate}
    ports:
      # 宿主端口可经环境变量改写（默认 5432，与 README §6 端口约定一致）；
      # 本机 5432 被其他项目占用时，在 .env 里设 POSTGRES_HOST_PORT 换端口。
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-silvermate} -d ${POSTGRES_DB:-silvermate}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: silvermate-redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  funasr:
    # 本地 ASR 基线（FunASR runtime，2pass 双通路流式）。宿主端口 7002 —— 7001 已登记给 laya
    # （见 docs/plans/task-a1-ASR与TTS适配层.md §4.4 与 §9-1），不要再抢。
    # **共享口径（主理人 2026-11-13）**：默认不自起（重服务，首启拉模型数 GB），全员连
    # dev-B 的实例（.env 设 ASR_BASE_URL=ws://<B的IP>:7002）；`--profile local` 本地自起。
    # 镜像内 FunASR runtime 默认监听 10095；本服务**不开 TLS**（官方 run_server_2pass.sh 里
    # --certfile/--keyfile 同样是注释掉的），所以客户端用 ws:// 而不是 wss://。
    profiles: ["local"]
    image: registry.cn-hangzhou.aliyuncs.com/funasr_repo/funasr:funasr-runtime-sdk-online-cpu-0.1.12
    container_name: silvermate-funasr
    init: true
    restart: unless-stopped
    ports:
      # 宿主端口可经环境变量改写（默认 7002，与 README §6 端口约定一致）。
      - "${FUNASR_HOST_PORT:-7002}:10095"
    volumes:
      # 首次启动按 --download-model-dir 下载到具名卷，之后复用；模型不进镜像层、也不落仓库目录。
      - funasr_models:/workspace/models
    working_dir: /workspace/FunASR/runtime/websocket/build/bin
    # 镜像内 run_server_2pass.sh 会把识别程序丢到后台并退出；这里直接前台起同一个可执行文件，
    # 让 Docker 能跟踪退出状态、restart 与日志（与参考 compose 同一做法）。
    entrypoint: ["/workspace/FunASR/runtime/websocket/build/bin/funasr-wss-server-2pass"]
    command:
      - --download-model-dir
      - /workspace/models
      - --vad-dir
      - damo/speech_fsmn_vad_zh-cn-16k-common-onnx
      - --model-dir
      - damo/speech_paraformer-large-vad-punc_asr_nat-zh-cn-16k-common-vocab8404-onnx
      - --online-model-dir
      - damo/speech_paraformer-large_asr_nat-zh-cn-16k-common-vocab8404-online-onnx
      - --punc-dir
      - damo/punc_ct-transformer_zh-cn-common-vad_realtime-vocab272727-onnx
      - --lm-dir
      - damo/speech_ngram_lm_zh-cn-ai-wesp-fst
      - --itn-dir
      - thuduj12/fst_itn_zh
      - --port
      - "10095"
      - --decoder-thread-num
      - "4"
      - --model-thread-num
      - "1"
      - --io-thread-num
      - "1"
    healthcheck:
      # 纯 TCP 探活：本服务不开 TLS，所以不做 TLS 握手（参考 compose 那版是为了 wss 才握手的）。
      # 首次要下载 + 加载模型（几 GB、几分钟），start_period 给足 180s；之后每 10s 一次，
      # 连续 6 次失败才标 unhealthy。健康检查失败不会自动重启容器，慢机器上「先 unhealthy 后
      # healthy」属正常，重看 docker compose ps 即可。
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1', 10095), timeout=5).close()"]
      start_period: 180s
      interval: 10s
      timeout: 5s
      retries: 6
    # 限核：ASR 推理是 CPU 密集，别让它把 postgres/redis 和本地开发抢死（deploy 段在非 swarm
    # 的 docker compose v2 下同样生效）。
    deploy:
      resources:
        limits:
          cpus: "2"
    stop_grace_period: 30s

  mock-operations-mcp:
    # mock-operations MCP 容器（Day 10 七服务版提前件，contracts.md v1.8 口径）：
    # create_work_order / send_family_notification 两工具，Mock 落库非真实外发。
    # 容器内绑 0.0.0.0 供 backend 走 compose 内部网络（mock-operations-mcp:7102）。
    # 环回端口映射：让宿主机（本地裸跑的 backend / curl）也能访问容器，
    # 仅绑 127.0.0.1 不暴露公网；backend 容器化后改走内部服务名，届时可移除。
    ports:
      - "127.0.0.1:7102:7102"
    build:
      context: .
      dockerfile: deploy/mock-operations/Dockerfile
    container_name: silvermate-mock-operations-mcp
    restart: unless-stopped
    environment:
      MOCK_OPERATIONS_MCP_HOST: 0.0.0.0
      # 容器内覆盖 .env 的本地库地址：一律指向 compose 服务名 postgres
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-silvermate}:${POSTGRES_PASSWORD:-silvermate}@postgres:5432/${POSTGRES_DB:-silvermate}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # MCP 协议级探活：POST tools/list，能返回 JSON-RPC 即存活
      test: ["CMD", "python", "-c", "import urllib.request,json; req=urllib.request.Request('http://127.0.0.1:7102/mcp', data=json.dumps({'jsonrpc':'2.0','id':1,'method':'tools/list','params':{}}).encode(), headers={'Content-Type':'application/json','Accept':'application/json'}); urllib.request.urlopen(req, timeout=5).read()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  weather-mcp:
    # weather MCP 容器（Day 10 七服务版提前件）：唯一真实外部接口 MCP（AGENTS §1）。
    # 容器内绑 0.0.0.0 供 backend 走 compose 内部网络（weather-mcp:7101）；
    # **不做宿主机端口映射**（本地裸跑用 `uv run python mcp-servers/weather/server.py --http`）。
    # 密钥经 compose 变量替换从 .env 注入环境变量，不进镜像层；缺 key 时
    # weather_core 按口径返回「key 未配置」的显式失败，不编造天气。
    build:
      context: .
      dockerfile: deploy/weather/Dockerfile
    container_name: silvermate-weather-mcp
    restart: unless-stopped
    environment:
      WEATHER_MCP_HOST: 0.0.0.0
      WEATHER_API_PROVIDER: ${WEATHER_API_PROVIDER:-amap}
      WEATHER_API_BASE_URL: ${WEATHER_API_BASE_URL:-}
      WEATHER_API_KEY: ${WEATHER_API_KEY:-}
      WEATHER_CACHE_TTL_SECONDS: ${WEATHER_CACHE_TTL_SECONDS:-600}
    # 环回端口映射（同 mock-operations-mcp 口径）：仅绑 127.0.0.1，宿主机可访问
    ports:
      - "127.0.0.1:7101:7101"
    healthcheck:
      # MCP 协议级探活：POST tools/list，能返回 JSON-RPC 即存活
      test: ["CMD", "python", "-c", "import urllib.request,json; req=urllib.request.Request('http://127.0.0.1:7101/mcp', data=json.dumps({'jsonrpc':'2.0','id':1,'method':'tools/list','params':{}}).encode(), headers={'Content-Type':'application/json','Accept':'application/json'}); urllib.request.urlopen(req, timeout=5).read()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  voiceprint:
    # 声纹推理容器（Day 4 A1）。只做 POST /extract + GET /health。
    # 比对在主服务进程内 numpy 完成，容器不装 torch（重依赖隔离）。
    # **共享口径（主理人 2026-11-13）**：默认不自起，全员连 dev-B 的实例
    # （.env 设 VOICEPRINT_BASE_URL=http://<B的IP>:7003）；`--profile local` 本地自起。
    # 宿主端口 7003（compose 网络内主服务用 voiceprint:7003）。
    profiles: ["local"]
    build:
      context: ./deploy/voiceprint
      dockerfile: Dockerfile
    container_name: silvermate-voiceprint
    restart: unless-stopped
    ports:
      - "${VOICEPRINT_HOST_PORT:-7003}:7003"
    volumes:
      # 模型文件（CAM++ .onnx）手动放 deploy/voiceprint/models/ 后 compose 自动挂载
      - ./deploy/voiceprint/models:/app/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7003/health', timeout=5).read()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1"

  backend:
    # backend API 容器（Day 10 · A2a，dev-A）：A1 镜像（两阶段 + 非 root + entrypoint 自动迁移）。
    # **不做宿主机端口映射**（对齐 weather-mcp 口径）：宿主 8000 常被本地 uvicorn 占用
    # （netstat 实测 LISTENING），调试流量统一走 nginx 反代与 docker exec；需要直连时
    # 临时 `docker run -p 18000:8000`。密钥经 env_file=.env 运行时注入，不进镜像层。
    build:
      context: .
      dockerfile: Dockerfile
    container_name: silvermate-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # —— 数据层（服务名 + .env 口令，与 mock-operations-mcp 同款写法）——
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-silvermate}:${POSTGRES_PASSWORD:-silvermate}@postgres:5432/${POSTGRES_DB:-silvermate}
      LANGGRAPH_CHECKPOINT_DATABASE_URL: postgresql://${POSTGRES_USER:-silvermate}:${POSTGRES_PASSWORD:-silvermate}@postgres:5432/${POSTGRES_DB:-silvermate}
      REDIS_URL: redis://redis:6379/0
      # —— 内部依赖地址覆盖（config.py 默认 localhost，容器内不可达：计划 §2#10）——
      MCP_WEATHER_SERVER_URL: http://weather-mcp:7101
      MCP_OPERATIONS_SERVER_URL: http://mock-operations-mcp:7102
      # **共享口径（主理人 2026-11-13）**：funasr/voiceprint 重服务不自起、默认连 dev-B 实例——
      # 在 .env 设 VOICEPRINT_BASE_URL=http://<B的局域网IP>:7003、ASR_BASE_URL=ws://<B的IP>:7002；
      # 两服务已 profile 化（--profile local 自起），不设 .env 时下面的默认值（服务名）才可达
      VOICEPRINT_BASE_URL: ${VOICEPRINT_BASE_URL:-http://voiceprint:7003}
      ASR_BASE_URL: ${ASR_BASE_URL:-ws://funasr:10095}
      # System One：默认连 compose 内 laya 容器（--profile laya）；本机兜底形态（宿主 jev
      # sidecar）时在 .env 覆盖 SYSTEM_ONE_BASE_URL=http://host.docker.internal:7001
      SYSTEM_ONE_BASE_URL: ${SYSTEM_ONE_CONTAINER_URL:-http://laya:7001}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      weather-mcp:
        condition: service_started
      mock-operations-mcp:
        condition: service_started
    healthcheck:
      # 镜像内无 curl（slim 最小化），以 python urllib 等价实现；与任务书「curl /health」
      # 口径差异在此登记（计划 v1.3 S1+S2 执行记录）
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s

  nginx:
    # 前端托管 + 反代（Day 10 · A2a 骨架 / A3a S6 完整配置，dev-A）。镜像 = dev-C C1
    # 交付的 frontend/frontend.Dockerfile（Y3：容器内 /usr/share/nginx/html/{pad,console,family}）。
    # deploy/nginx.conf 归 dev-A 独占：S6 已升格为完整托管配置（443 TLS + 80→443 +
    # 三入口静态 + /avatars + /health + /static + /api + /ws 反代），以只读卷覆盖镜像内
    # 的 Y1 草案；同时修掉草案 `no resolver defined to resolve backend` 导致的 /api 502。
    # 证书目录 deploy/certs/ 由 S6 预置自签开发证书（S7 换 mkcert 受控信任），
    # 文件不进 git（根 .gitignore 已有 certs/ / *.pem / *.key），干净主机需先生成。
    build:
      context: ./frontend
      dockerfile: frontend.Dockerfile
    container_name: silvermate-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_HOST_PORT:-80}:80"
      - "${NGINX_HTTPS_HOST_PORT:-443}:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # 80 已改为 301 跳 443，故改探 nginx 自身的 /nginx-health（纯存活、不依赖
      # backend 与 busybox wget 的 HTTPS 能力）；三入口与 /health 由 S6 命令级自检覆盖。
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  coturn:
    # TURN 中继（Day 10 · A2-b，dev-A）：day09 D2.5 的 GET /api/audio/ice-config 下发
    # turn_url/turn_username/turn_credential（字段只读不改名），本服务鉴权值与 .env
    # 同源经 compose 变量注入 command，不写死在 deploy/turnserver.conf（该文件进 git）。
    # 端口 3478（UDP+TCP，README §6.2 约定）；5349 TLS 待 S7 证书就绪后启用。
    # 局域网教学场景不做公网中继（external-ip 留注释，见 turnserver.conf）。
    image: coturn/coturn:latest
    container_name: silvermate-coturn
    restart: unless-stopped
    command: >
      -c /etc/coturn/turnserver.conf
      --user ${TURN_USERNAME:-silvermate}:${TURN_CREDENTIAL:-}
    volumes:
      - ./deploy/turnserver.conf:/etc/coturn/turnserver.conf:ro
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
    healthcheck:
      # coturn 镜像（alpine）无 python/curl，用 /proc/net/tcp 探 3478 监听（hex 0D96）
      test: ["CMD-SHELL", "grep -qi ':0D96' /proc/net/tcp /proc/net/tcp6 2>/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s

  laya:
    # Laya / System One sidecar 容器化定义（Day 10 · A2-b，dev-A）。Q7 裁决：挂载宿主已下载权重卷
    # （宿主 .env 实测 SYSTEM_ONE_MODEL_PATH=C:/models/laya/multilingual，615MB 不重复拉取）。
    # **本机兜底形态（S4 实测留痕）**：Docker Desktop/WSL2 内存上限仅 1.86GB（docker stats 实测），
    # 权重+torch 需 3-4GB——本机容器化不可行，Q7 兜底生效：宿主 jev 进程 sidecar（7001）继续服务，
    # 本服务 profile 化（`--profile laya` 激活，供内存充足的机器/干净主机演练用）。
    # 镜像 torch 安装走「宿主预下载 Linux wheel 离线装」（deploy/laya/Dockerfile 头注释，wheels/ 不进 git）。
    build:
      context: .
      dockerfile: deploy/laya/Dockerfile
    container_name: silvermate-laya
    restart: unless-stopped
    profiles: ["laya"]
    environment:
      SYSTEM_ONE_ENABLED: "true"
      SYSTEM_ONE_PROVIDER: laya
      SYSTEM_ONE_DEVICE: cpu
      SYSTEM_ONE_MODEL_ID: ${SYSTEM_ONE_MODEL_ID:-laya-multilingual}
      SYSTEM_ONE_MODEL_VERSION: ${SYSTEM_ONE_MODEL_VERSION:-laya:multilingual:dev}
      SYSTEM_ONE_MODEL_PATH: /models/laya/multilingual
      # 容器内路径；权重内容来自宿主卷只读挂载
    volumes:
      - ${SYSTEM_ONE_MODEL_HOST_DIR:-C:/models/laya}:/models/laya:ro
    ports:
      # 环回映射：本地裸跑 backend / scripts/sidecar_bench.py 仍可访问；backend 容器走 laya:7001。
      # 宿主 7001 默认留给常驻的 jev sidecar 进程（本机联调现状实测占用），容器映射默认 7011 避让
      - "${LAYA_HOST_PORT:-7011}:7001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7001/health', timeout=5).read()"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 120s   # 权重 615MB 建图实测约 40s（宿主），容器内更慢，留足余量

  langfuse-web:
    # Langfuse v4 全家桶（Day 10 · A2-b，dev-A）。**Q4 改判（dev-B 通知，2026-11-13，落档
    # dev-b 计划件 §8.1-⑨ / commit 56345ab）**：OTLP 摄入端点是 Langfuse v3.22 才引入的，
    # v2 收不了 OTel span（B 在 v2.95 容器实测 api/public/ 无 otel 路由）——B1 观测代码走
    # OTLP/HTTP，实例必须 v3.22+（现行 v4）。共享实例常驻 dev-B 主机（六容器已起好、冒烟全过），
    # 全员默认连 B 的 `LANGFUSE_HOST`，**本段六服务全部 profile 化默认不起**——compose 这套是
    # 「一键启动/干净主机演练」的兜底（`docker compose --profile langfuse up` 激活）。
    # 编排对齐官方 v4 模板（langfuse.com/self-hosting）；基础设施端口不映射宿主
    # （本机 5432/6379 已被业务 postgres/redis 占用），仅 web 3000 对外。
    image: docker.langfuse.com/langfuse/langfuse:${LANGFUSE_IMAGE_TAG:-4}
    container_name: silvermate-langfuse-web
    restart: unless-stopped
    profiles: ["langfuse"]
    ports:
      - "${LANGFUSE_HOST_PORT:-3000}:3000"
    environment: &langfuse-env
      NEXTAUTH_URL: ${LANGFUSE_NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-changeme-generate-a-random-secret}
      SALT: ${LANGFUSE_SALT:-changeme-generate-a-random-salt}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:-changeme-64-hex-via-openssl-rand-hex-32}
      DATABASE_URL: postgresql://${LANGFUSE_POSTGRES_USER:-langfuse}:${LANGFUSE_POSTGRES_PASSWORD:-langfuse}@langfuse-postgres:5432/${LANGFUSE_POSTGRES_DB:-langfuse}
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_USER: ${LANGFUSE_CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:-clickhouse}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_HOST: langfuse-redis
      REDIS_PORT: "6379"
      REDIS_AUTH: ${LANGFUSE_REDIS_AUTH:-changeme-redis-password}
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_MINIO_ROOT_USER:-minio}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_ROOT_PASSWORD:-changeme-minio-secret}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_MINIO_ROOT_USER:-minio}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_ROOT_PASSWORD:-changeme-minio-secret}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:${LANGFUSE_MINIO_HOST_PORT:-9090}
      LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
    depends_on:
      langfuse-postgres:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/public/health"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 90s

  langfuse-worker:
    # v4 摄入 worker（与 web 同镜像同变量；OTel span/trace 落库的执行者）
    image: docker.langfuse.com/langfuse/langfuse-worker:${LANGFUSE_IMAGE_TAG:-4}
    container_name: silvermate-langfuse-worker
    restart: unless-stopped
    profiles: ["langfuse"]
    environment:
      <<: *langfuse-env
    depends_on:
      langfuse-postgres:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3030/api/public/health"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 90s

  langfuse-postgres:
    # v4 元数据库（官方口径：postgres 只存元数据，trace 数据在 ClickHouse）；
    # 独立实例与业务 postgres 物理隔离（v4 不再走 v2 的 schema 复用方案）
    image: docker.io/postgres:${LANGFUSE_POSTGRES_VERSION:-17}
    container_name: silvermate-langfuse-postgres
    restart: unless-stopped
    profiles: ["langfuse"]
    environment:
      POSTGRES_USER: ${LANGFUSE_POSTGRES_USER:-langfuse}
      POSTGRES_PASSWORD: ${LANGFUSE_POSTGRES_PASSWORD:-langfuse}
      POSTGRES_DB: ${LANGFUSE_POSTGRES_DB:-langfuse}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LANGFUSE_POSTGRES_USER:-langfuse}"]
      interval: 5s
      timeout: 5s
      retries: 10

  langfuse-redis:
    # v4 队列缓存（BullMQ）；独立实例，不与业务 redis 共用（maxmemory-policy noeviction 硬要求）
    image: docker.io/redis:7
    container_name: silvermate-langfuse-redis
    restart: unless-stopped
    profiles: ["langfuse"]
    command: >
      --requirepass ${LANGFUSE_REDIS_AUTH:-changeme-redis-password}
      --maxmemory-policy noeviction
    volumes:
      - langfuse_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${LANGFUSE_REDIS_AUTH:-changeme-redis-password}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  langfuse-clickhouse:
    # v4 trace 数据主存（OLAP）
    image: docker.io/clickhouse/clickhouse-server:26.3.62.3
    container_name: silvermate-langfuse-clickhouse
    restart: unless-stopped
    profiles: ["langfuse"]
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: ${LANGFUSE_CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:-clickhouse}
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  langfuse-minio:
    # v4 事件/媒体对象存储（S3 兼容）；entrypoint 预建 langfuse 桶（官方口径，无需 init 容器）
    image: cgr.dev/chainguard/minio
    container_name: silvermate-langfuse-minio
    restart: unless-stopped
    profiles: ["langfuse"]
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: ${LANGFUSE_MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${LANGFUSE_MINIO_ROOT_PASSWORD:-changeme-minio-secret}
    ports:
      # 浏览器媒体直传走 localhost:9090（LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT）
      - "${LANGFUSE_MINIO_HOST_PORT:-9090}:9000"
      - "127.0.0.1:9091:9001"
    volumes:
      - langfuse_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
  funasr_models:
  langfuse_postgres_data:
  langfuse_redis_data:
  langfuse_clickhouse_data:
  langfuse_clickhouse_logs:
  langfuse_minio_data:
