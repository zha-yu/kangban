# Alembic config - SilverMate (Kangban) 3D digital-human companion system.
# Migration batches and table list: see docs/ (ER design doc) section 6.
# Main migrations are immutable once merged - always add a new revision instead.
#
# NOTE: keep this file ASCII-only. configparser reads it with the platform locale
# (GBK on zh-CN Windows) and raises UnicodeDecodeError on non-ASCII bytes.
[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# URL is intentionally left empty: alembic/env.py reads DATABASE_URL from the
# environment (.env is loaded by Pydantic Settings).
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
