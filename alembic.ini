# Alembic 配置 · 康伴（SilverMate）
# 迁移顺序与表清单见 docs/ER_数据模型设计.md §6；主迁移一经合入不再改，只加新迁移。
[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# 连接串不写这里：由 alembic/env.py 从环境变量 DATABASE_URL 读取（.env 由 Pydantic Settings 加载）
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
